name: content-gap-report

# Phase 4 loop: cluster the ask pipeline's gap log into a public issue on the
# content repo, weekly. The issue IS the ingest queue for the next content run.
# Needs a cross-repo PAT (repo secret CROSS_REPO_TOKEN) with issues:write on
# 256foundation/public-mining-brain — see STATE.md "Needs Tyler".

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live gap board
        id: gaps
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "${{ env.WIKI_URL }}/api/gaps.json" -o gaps.json
          python3 - <<'EOF'
          import json, os
          data = json.load(open("gaps.json"))
          gaps = data.get("gaps", [])
          stats = data.get("stats", {})
          lines = []
          for g in gaps[:20]:
              lines.append(f"- **{g['count']}×** {g['question']} (last asked {g['lastAskedAt'][:10]})")
          summary = "\n".join(lines) if lines else "_No open gaps this week — nice._"
          body = (
              f"## Weekly content-gap report\n\n"
              f"Distinct gaps: **{stats.get('distinctGaps', 0)}** · "
              f"ungrounded asks: **{stats.get('gapAsks', 0)}**\n\n"
              f"Top clusters (highest demand first):\n\n{summary}\n\n"
              f"— generated by 256-wiki CI from https://wiki.256foundation.org/api/gaps.json"
          )
          with open("gap-report.md", "w") as f:
              f.write(body)
          print(f"distinct={stats.get('distinctGaps', 0)} asks={stats.get('gapAsks', 0)}")
          EOF
        env:
          WIKI_URL: https://wiki.256foundation.org

      - name: File or update the content-gap issue
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Weekly content-gap report ($(date -u +%F))"
          # update the pinned tracking issue when it exists, else file a new one
          existing=$(gh issue list -R 256foundation/public-mining-brain \
            --label content-gap --state open --limit 1 --json number \
            --search "Weekly content-gap report in:title" | python3 -c "import json,sys; a=json.load(sys.stdin); print(a[0]['number'] if a else '')")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R 256foundation/public-mining-brain --body-file gap-report.md
          else
            gh issue create -R 256foundation/public-mining-brain \
              --label content-gap --title "Weekly content-gap report ($(date -u +%F))" \
              --body-file gap-report.md
          fi
